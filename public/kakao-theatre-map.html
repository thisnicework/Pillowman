<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울예술대학교 마동 예장 지도</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141416;
      user-select: none;
      -webkit-user-select: none;
    }
    #map-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .root_daum_roughmap {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }
    .root_daum_roughmap .wrap_map {
      height: 100% !important;
      cursor: default !important;
    }
    .root_daum_roughmap .map_border {
      display: none !important;
    }
    /* Hide roughmap built-in controllers so custom parent zoom controls handle zooming */
    .root_daum_roughmap .wrap_btn_zoom,
    .root_daum_roughmap .btn_zoom_reset,
    .root_daum_roughmap .btn_big_map {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <div id="daumRoughmapContainer1792948310052" class="root_daum_roughmap root_daum_roughmap_landing"></div>
  </div>

  <script>
    window.daum = window.daum || {};
    window.daum.roughmap = {
      phase: 'prod',
      cdn: '2851f17d_1789535060426',
      loader: 'tenth',
      URL_KEY_DATA_LOAD_PRE: 'https://t1.kakaocdn.net/roughmap/',
      url_protocal: 'https:',
      url_cdn_domain: '//t1.kakaocdn.net'
    };
  </script>
  <script src="https://t1.kakaocdn.net/kakaomapweb/roughmap/place/prod/2851f17d_1789535060426/roughmapLander.js"></script>
  <script>
    function applyLock(map) {
      if (!map) return;
      if (typeof map.setDraggable === 'function') {
        map.setDraggable(false);
      }
      if (typeof map.setZoomable === 'function') {
        map.setZoomable(false);
      }
    }

    if (window.daum && window.daum.roughmap && window.daum.roughmap.Lander) {
      var origRenderMap = window.daum.roughmap.Lander.prototype.renderMap;
      window.daum.roughmap.Lander.prototype.renderMap = function() {
        origRenderMap.apply(this, arguments);
        applyLock(this.jsMap);
      };
    }

    var lander = new daum.roughmap.Lander({
      timestamp: '1792948310052',
      key: '3vtb5opwqmx',
      mapHeight: '480'
    });
    lander.render();

    function cleanZoomUI() {
      var wrap = document.querySelector('.wrap_btn_zoom');
      if (wrap) {
        wrap.style.setProperty('height', '65px', 'important');
        wrap.style.setProperty('overflow', 'hidden', 'important');
        var resets = wrap.querySelectorAll('.btn_zoom_reset, .btn_big_map');
        for (var i = 0; i < resets.length; i++) {
          resets[i].remove();
        }
        var extraChildren = wrap.querySelectorAll(':scope > *:not(.btn_zoom_in):not(.btn_zoom_out)');
        for (var j = 0; j < extraChildren.length; j++) {
          extraChildren[j].remove();
        }
      }
    }

    function getMap() {
      var instance = window.daum && window.daum.roughmap && window.daum.roughmap.instances && window.daum.roughmap.instances['1792948310052'];
      return instance && instance.jsMap ? instance.jsMap : null;
    }

    function zoomIn() {
      var map = getMap();
      if (map && typeof map.getLevel === 'function' && typeof map.setLevel === 'function') {
        var nextLevel = Math.max(1, map.getLevel() - 1);
        map.setLevel(nextLevel, { animate: true });
      } else {
        var btn = document.querySelector('.btn_zoom_in');
        if (btn) btn.click();
      }
    }

    function zoomOut() {
      var map = getMap();
      if (map && typeof map.getLevel === 'function' && typeof map.setLevel === 'function') {
        var nextLevel = Math.min(14, map.getLevel() + 1);
        map.setLevel(nextLevel, { animate: true });
      } else {
        var btn = document.querySelector('.btn_zoom_out');
        if (btn) btn.click();
      }
    }

    window.zoomIn = zoomIn;
    window.zoomOut = zoomOut;

    window.addEventListener('message', function(event) {
      if (!event || !event.data) return;
      var action = typeof event.data === 'string' ? event.data : event.data.type;
      if (action === 'ZOOM_IN') {
        zoomIn();
      } else if (action === 'ZOOM_OUT') {
        zoomOut();
      }
    });

    var lockAttempts = 0;
    var lockInterval = setInterval(function() {
      lockAttempts++;
      cleanZoomUI();
      var map = getMap();
      if (map) {
        applyLock(map);
      }
      if (lockAttempts > 60) {
        clearInterval(lockInterval);
      }
    }, 50);

    // Observer to continuously guarantee clean zoom UI if Kakao re-renders
    var observer = new MutationObserver(function() {
      cleanZoomUI();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Prevent wheel zoom from affecting map
    window.addEventListener('wheel', function(e) {
      var map = getMap();
      if (map) {
        applyLock(map);
      }
    }, { passive: true });
  </script>
</body>
</html>
